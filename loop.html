<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="../javascript-learning/loop.css">

    <title>Document</title>
</head>
<body>    
    <p>To print the first 5 Numbers</p>
    <p id="demo"></p>

    <p>To print the first 5 odd Numbers</p>
    <p id="demo2"></p>

    <p>To print the first 5 even numbers</p>
    <p id="demo3"></p>

    <p>To print Numbers from 1 to 20 (Even or Odd)</p>
    <p id="demo4"></p>

    <script>
        let result = "";

        // 1. First 5 Numbers (1 to 5)
        let i1 = 1;
        do {
            result += i1 + "<br>";
            i1++;
        } while (i1 <= 5);
        document.getElementById("demo").innerHTML = result;

        // 2. First 5 odd Numbers (1, 3, 5, 7, 9)
        result = "";
        let i2 = 1;
        do {
            result += i2 + "<br>";
            i2 += 2;
        } while (i2 <= 9);
        document.getElementById("demo2").innerHTML = result;

        // 3. First 5 even numbers (2, 4, 6, 8, 10)
        result = "";
        let i3 = 2;
        do {
            result += i3 + "<br>";
            i3 += 2;
        } while (i3 <= 10);
        document.getElementById("demo3").innerHTML = result;

        // 4. Numbers from 1 to 20 (Even or Odd)
        result = "";
        let i4 = 1;
        do {
            if (i4 % 2 == 0) {
                result += i4 + " Is even<br>";
            } else {
                result += i4 + " Is odd<br>";
            }
            i4++;
        } while (i4 <= 20);
        document.getElementById("demo4").innerHTML = result;
    </script>
</body>
</html>
