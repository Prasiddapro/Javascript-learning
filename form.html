<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Signup Form</h1>
    <form>
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>
        
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>
        
        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>
        
        <button type="button" onclick="showSubmit()">Submit</button>
    </form>

    <p id="demo"></p>

    <script>
        function submitForm(){
            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let password = document.getElementById("password").value;

            return "Name: " + name + "<br> Email: " + email;
        }

        // Updated showSubmit() to call submitForm() and display both the details and success message
        function showSubmit(){
            let details = submitForm();
            document.getElementById("demo").innerHTML = details + "<br>Form is submitted successfully";
        }
    </script>
</body>
</html>
