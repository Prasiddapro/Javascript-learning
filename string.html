<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String</title>
</head>

<body>
    <h1>STRING</h1>


<script>
    let name = "Prasidda";
let age = 13;
let city = "Aberdeen";
let country = "UK";

document.getElementById(`Name: ${name}<br>`);
document.getElementById(`Age: ${age}<br>`);
document.getElementById(`City: ${city}<br>`);
document.getElementById(`Country: ${country}<br>`);

document.getElementById(`Length of the string: ${name.length}<br>`);
document.getElementById(`Length of the string: ${city.length}<br>`);
document.getElementById(`Length of the string: ${country.length}<br>`);
document.getElementById(`Length of the string: ${age.toString().length}<br>`);
</script>


</body>
</html>
