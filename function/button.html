<!DOCTYPE html>
<html>

<body>
    <h1>JavaScript Functions</h1>

    <p>You can call functions from events.</p>

    <button onclick="showHello()">Click Me</button>
    <button onclick="sumbitForm()">Sumbit </button>

    <p id="demo"></p>
    <p id="demo2"></p>

    <script>
        function sayHello() {
            return "Hello World";
        }

        function showHello() {
            document.getElementById("demo").innerHTML = sayHello();
        }

          function sumbitForm() {
            return "Form sumbitted";  
        }
        function showSumbit() {
            document.getElementById("demo2").innerHTML = sumbitForm();
        }
    </script>
</body>

</html>
