<!DOCTYPE html>
<html>
<head>
    <title>Math Operations</title>
</head>
<body>

    <p id="addition"></p>
    <p id="subtraction"></p>
    <p id="multiplication"></p>
    <p id="division"></p>

    <script>
        let a = 500;
        let b = 50;

        function add(a, b) {
            let addition = a + b;
            return addition;

        }
        let result1 = add(a, b);
        document.getElementById("addition").innerHTML = "the addition of two numbers is " + result1;


        let c = 500;
        let d = 50;

        function subtract(c, d) {
            let subtraction = c - d;
            return subtraction;

        }
        let result2 = subtract(c, d);
        document.getElementById("subtraction").innerHTML = "the subtraction of two numbers is " + result2;


        let e = 500;
        let f = 50;

        function multiply(e, f) {
            let multiplication = e * f;
            return multiplication;

        }
        let result3 = multiply(e, f);
        document.getElementById("multiplication").innerHTML = "the multiplication of two numbers is " + result3;


        let g = 500;
        let h = 50;

        function divide(g, h) {
            let division = g / h;
            return division;

        }
        let result4 = divide(g, h);
        document.getElementById("division").innerHTML = "the division of two numbers is " + result4;
    </script>

</body>
</html>
