<!DOCTYPE html>
<html>
<head>
    <title>Math Operations Homework</title>
</head>
<body>
<h1>WELCOME</h1>
    <p id="addResult"></p>
    <p id="subResult"></p>
    <p id="multResult"></p>
    <p id="divResult"></p>

    <script>
        let a = 10;
        let b = 20;

        function addition(a, b) {
            let add = a + b;
            document.getElementById("addResult").innerText = "the addition of two numbers is " + add;
        }

        addition(a, b);


        let c = 100;
        let d = 50;

        function substract(c, d) {
            let substract = c - d;
            document.getElementById("subResult").innerText = "the substraction of two numbers is " + substract;
        }

        substract(c, d);


        let e = 100;
        let f = 50;

        function multiply(e, f) {
            let multiplication = e * f;
            document.getElementById("multResult").innerText = "the multiplication of two numbers is " + multiplication;
        }

        multiply(e, f);


        let g = 500;
        let h = 50;

        function divide(g, h) {
            let division = g / h;
            document.getElementById("divResult").innerText = "the division of two numbers is " + division;
        }

        divide(g, h);
    </script>

</body>
</html>
