<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p>This is the JavaScript learning</p>
    <p id="demo"></p>
    <button onclick="showHello()">Submit</button>

    <script>
        function sayHello() {
            return "form submitted;";
        }

        function showHello() {
            document.getElementById("demo").innerHTML = sayHello();
        }
    </script>
</body>
</html>
